
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b36">
<title>ATLAS METEO 2.0</title>

<style>
:root {
  color-scheme: dark;
  --bg: #071b36;
  --card: #102c50;
  --blue: #38bdf8;
  --text: #f0f8ff;
  --muted: #b7cbe2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top, #174775, var(--bg) 65%);
}

main {
  max-width: 720px;
  margin: auto;
}

header {
  text-align: center;
  padding: 24px 10px;
}

.logo {
  font-size: 52px;
}

h1 {
  margin: 8px 0;
  font-size: clamp(27px, 7vw, 42px);
  letter-spacing: 2px;
}

header p, .muted {
  color: var(--muted);
}

.card {
  background: rgba(16, 44, 80, .94);
  border: 1px solid #315578;
  border-radius: 20px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 10px 30px #0003;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input, button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}

input {
  border: 1px solid #52789f;
  background: #071b36;
  color: white;
  margin-bottom: 12px;
}

button {
  border: 0;
  background: var(--blue);
  color: #06203b;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 0;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.secondary {
  background: #24486f;
  color: white;
}

.quick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.quick button {
  font-size: 14px;
  padding: 12px 8px;
}

#status {
  min-height: 24px;
  color: #bae6fd;
  margin-top: 12px;
  white-space: pre-wrap;
}

#result {
  display: none;
}

.big-temp {
  font-size: 58px;
  font-weight: bold;
  margin: 12px 0;
  color: #7dd3fc;
}

.weather-icon {
  font-size: 54px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 18px;
}

.stat {
  background: #071b36;
  border-radius: 12px;
  padding: 14px;
}

.stat strong {
  display: block;
  font-size: 20px;
  margin-top: 8px;
}

.forecast-day {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid #315578;
}

.forecast-day:last-child {
  border-bottom: none;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 20px 0;
}

.small {
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 380px) {
  body { padding: 10px; }
  .card { padding: 15px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<body>
<main>
  <header>
    <div class="logo">🌦️</div>
    <h1>ATLAS METEO 2.0</h1>
    <p>Seu assistente inteligente de previsão do tempo</p>
  </header>

  <section class="card">
    <label for="city">📍 Qual cidade tu quer consultar?</label>
    <input id="city" type="text"
      placeholder="Ex.: Giruá, Tapera, Porto Alegre"
      autocomplete="address-level2">

    <label for="question">💬 O que tu quer saber?</label>
    <input id="question" type="text"
      placeholder="Vai chover amanhã?"
      autocomplete="off">

    <button id="searchBtn" onclick="askWeather()">
      🔎 Consultar previsão
    </button>

    <div class="quick">
      <button class="secondary" onclick="quickAsk('agora')">
        🌡️ Tempo agora
      </button>
      <button class="secondary" onclick="quickAsk('amanhã')">
        🌧️ Previsão amanhã
      </button>
      <button class="secondary" onclick="quickAsk('depois de amanhã')">
        📅 Depois de amanhã
      </button>
      <button class="secondary" onclick="quickAsk('7 dias')">
        🗓️ Próximos 7 dias
      </button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card" id="result" aria-live="polite">
    <div id="place" class="muted"></div>
    <div id="weatherIcon" class="weather-icon">🌤️</div>
    <h2 id="summary">Previsão do tempo</h2>
    <div id="temperature" class="big-temp">--°C</div>
    <div id="details" class="muted"></div>

    <div class="grid" id="stats"></div>

    <h3>📅 Próximos dias</h3>
    <div id="forecast"></div>

    <button id="speakBtn" onclick="speakAnswer()">
      🔊 Ouvir resposta
    </button>
    <button class="secondary" onclick="stopSpeech()">
      ⏹️ Parar voz
    </button>
  </section>

  <footer>
    ATLAS METEO 2.0 · Dados meteorológicos via Open-Meteo
    <br><br>
    A previsão é uma estimativa e pode mudar.
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);

let lastAnswer = "";
let lastData = null;
let lastCity = "";

function weatherInfo(code) {
  if (code === 0) return ["☀️", "Céu limpo"];
  if (code === 1) return ["🌤️", "Predominantemente limpo"];
  if (code === 2) return ["⛅", "Parcialmente nublado"];
  if (code === 3) return ["☁️", "Nublado"];
  if (code === 45 || code === 48) return ["🌫️", "Neblina"];
  if ([51, 53, 55, 56, 57].includes(code))
    return ["🌦️", "Garoa"];
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code))
    return ["🌧️", "Chuva"];
  if ([71, 73, 75, 77, 85, 86].includes(code))
    return ["❄️", "Neve"];
  if ([95, 96, 99].includes(code))
    return ["⛈️", "Trovoadas"];
  return ["🌡️", "Condição variável"];
}

function formatDate(dateString) {
  const parts = dateString.split("-").map(Number);
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  return date.toLocaleDateString("pt-BR", {
    weekday: "short",
    day: "2-digit",
    month: "2-digit"
  });
}

function normalize(text) {
  return text.normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function quickAsk(question) {
  $("question").value = question;
  askWeather();
}

async function askWeather() {
  const city = $("city").value.trim();
  const question = $("question").value.trim();

  if (!city) {
    $("status").textContent = "📍 Digita o nome de uma cidade primeiro.";
    $("city").focus();
    return;
  }

  $("searchBtn").disabled = true;
  $("status").textContent = "🔄 Buscando os dados meteorológicos...";
  $("result").style.display = "none";
  stopSpeech();

  try {
    const geoUrl =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city) +
      "&count=10&language=pt&format=json";

    const geoResponse = await fetch(geoUrl);
    if (!geoResponse.ok) throw new Error("Não foi possível buscar a cidade.");

    const geo = await geoResponse.json();

    if (!geo.results || geo.results.length === 0) {
      throw new Error("Não encontrei essa cidade. Confere o nome e tenta de novo.");
    }

    const normalizedCity = normalize(city);
    const location = geo.results.find(item =>
      normalize(item.name) === normalizedCity
    ) || geo.results[0];

    const params = new URLSearchParams({
      latitude: location.latitude,
      longitude: location.longitude,
      current: [
        "temperature_2m",
        "apparent_temperature",
        "relative_humidity_2m",
        "wind_speed_10m",
        "precipitation",
        "weather_code"
      ].join(","),
      daily: [
        "weather_code",
        "temperature_2m_max",
        "temperature_2m_min",
        "precipitation_probability_max"
      ].join(","),
      forecast_days: "7",
      timezone: "auto"
    });

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?" + params
    );

    if (!response.ok) throw new Error("Erro ao consultar a previsão.");

    const data = await response.json();

    lastData = data;
    lastCity = location.name;
    renderWeather(location, data, question);

    $("status").textContent = "✅ Previsão atualizada!";
    $("result").style.display = "block";

  } catch (error) {
    $("status").textContent =
      "⚠️ " + (error.message ||
      "Não consegui consultar agora. Confere tua conexão e tenta novamente.");
  } finally {
    $("searchBtn").disabled = false;
  }
}

function renderWeather(location, data, question) {
  const current = data.current;
  const daily = data.daily;
  const info = weatherInfo(current.weather_code);
  const q = normalize(question);

  let dayIndex = 0;
  let dayLabel = "Agora";

  if (q.includes("depois de amanha")) {
    dayIndex = 2;
    dayLabel = "Depois de amanhã";
  } else if (q.includes("amanha")) {
    dayIndex = 1;
    dayLabel = "Amanhã";
  }

  if (q.includes("7 dias") || q.includes("semana")) {
    dayIndex = 0;
    dayLabel = "Próximos 7 dias";
  }

  const isCurrent = dayIndex === 0 &&
    !q.includes("7 dias") &&
    !q.includes("semana");

  $("place").textContent =
    "📍 " + location.name +
    (location.admin1 ? ", " + location.admin1 : "") +
    (location.country ? " · " + location.country : "");

  if (isCurrent) {
    $("weatherIcon").textContent = info[0];
    $("summary").textContent = "Tempo agora";
    $("temperature").textContent =
      Math.round(current.temperature_2m) + "°C";

    $("details").textContent =
      info[1] + " · Sensação térmica de " +
      Math.round(current.apparent_temperature) + "°C";

    $("stats").innerHTML = `
      <div class="stat">💧 Umidade
        <strong>${current.relative_humidity_2m}%</strong>
      </div>
      <div class="stat">💨 Vento
        <strong>${Math.round(current.wind_speed_10m)} km/h</strong>
      </div>
      <div class="stat">🌧️ Precipitação atual
        <strong>${current.precipitation} mm</strong>
      </div>
      <div class="stat">🌡️ Sensação térmica
        <strong>${Math.round(current.apparent_temperature)}°C</strong>
      </div>`;

    lastAnswer =
      `Em ${location.name}, agora está ${info[1].toLowerCase()}, ` +
      `com ${Math.round(current.temperature_2m)} graus Celsius. ` +
      `A sensação térmica é de ${Math.round(current.apparent_temperature)} graus, ` +
      `a umidade é de ${current.relative_humidity_2m} por cento ` +
      `e o vento está a ${Math.round(current.wind_speed_10m)} quilômetros por hora.`;

  } else {
    const i = dayIndex;
    const dailyInfo = weatherInfo(daily.weather_code[i]);

    $("weatherIcon").textContent = dailyInfo[0];
    $("summary").textContent = dayLabel;
    $("temperature").textContent =
      Math.round(daily.temperature_2m_max[i]) + "°C";

    $("details").textContent =
      dailyInfo[1] + " · Mínima de " +
      Math.round(daily.temperature_2m_min[i]) + "°C · Máxima de " +
      Math.round(daily.temperature_2m_max[i]) + "°C";

    const rain = daily.precipitation_probability_max[i];

    $("stats").innerHTML = `
      <div class="stat">🌡️ Mínima
        <strong>${Math.round(daily.temperature_2m_min[i])}°C</strong>
      </div>
      <div class="stat">🌞 Máxima
        <strong>${Math.round(daily.temperature_2m_max[i])}°C</strong>
      </div>
      <div class="stat">🌧️ Chance de chuva
        <strong>${rain == null ? "Sem dados" : rain + "%"}</strong>
      </div>
      <div class="stat">📅 Data
        <strong>${formatDate(daily.time[i])}</strong>
      </div>`;

    lastAnswer =
      `A previsão para ${dayLabel.toLowerCase()} em ${location.name} é ` +
      `${dailyInfo[1].toLowerCase()}, com mínima de ` +
      `${Math.round(daily.temperature_2m_min[i])} graus e máxima de ` +
      `${Math.round(daily.temperature_2m_max[i])} graus Celsius. ` +
      `A probabilidade máxima de chuva é de ` +
      (rain == null ? "valor não disponível." : rain + " por cento.");
  }

  let forecastHTML = "";

  for (let i = 0; i < daily.time.length; i++) {
    const day = weatherInfo(daily.weather_code[i]);
    const rain = daily.precipitation_probability_max[i];

    forecastHTML += `
      <div class="forecast-day">
        <span>${formatDate(daily.time[i])}</span>
        <span>${day[0]} ${day[1]}</span>
        <span>
          ${Math.round(daily.temperature_2m_min[i])}° /
          ${Math.round(daily.temperature_2m_max[i])}°
        </span>
      </div>
      <div class="small">
        Chance de chuva: ${rain == null ? "Sem dados" : rain + "%"}
      </div>`;
  }

  $("forecast").innerHTML = forecastHTML;
}

function speakAnswer() {
  if (!lastAnswer) {
    $("status").textContent = "Consulta uma cidade primeiro!";
    return;
  }

  if (!("speechSynthesis" in window)) {
    $("status").textContent =
      "Teu navegador não oferece leitura de voz. Tenta abrir no Chrome.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(lastAnswer);
  utterance.lang = "pt-BR";
  utterance.rate = 1;
  utterance.pitch = 1;

  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.toLowerCase() === "pt-br") ||
    voices.find(v => v.lang.toLowerCase().startsWith("pt"));

  if (voice) utterance.voice = voice;

  window.speechSynthesis.speak(utterance);
}

function stopSpeech() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

$("question").addEventListener("keydown", event => {
  if (event.key === "Enter") askWeather();
});

$("city").addEventListener("keydown", event => {
  if (event.key === "Enter") askWeather();
});

$("city").value = "Giruá";
</script>
</body>
  </html>
